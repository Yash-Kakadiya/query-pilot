# ==============================================================================
# QueryPilot Frontend Nginx Configuration
# Serves the React SPA and reverse-proxies /api/health and /api/query to backend
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for static web assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Reverse proxy: /api/health -> backend /health
    location = /api/health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;

        # Disable buffering for low-latency operational checks
        proxy_buffering off;
    }

    # 2. Reverse proxy: /api/query -> backend /query
    location = /api/query {
        proxy_pass http://backend:8000/query;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_set_header Content-Type $http_content_type;

        # Allow sufficient timeout for synchronous LLM generation + execution
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        client_max_body_size 1m;
    }

    # 3. Explicit rejection of any unapproved /api endpoints
    location /api/ {
        return 404;
    }

    # 4. Static assets with immutable caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 5. SPA fallback routing: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
