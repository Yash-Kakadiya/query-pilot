name: Desktop CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Backend, Frontend & AI Benchmark Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[test]"

      - name: Run Python backend test suite
        env:
          GEMINI_API_KEY: "ci-dummy-key-for-test-collection"
        run: |
          pytest -o pythonpath="src ." -m "not integration"

      - name: Run Frontend test suite
        run: |
          npm ci --prefix frontend
          npm test --prefix frontend

      - name: Run Canonical AI Evaluation Benchmark (Pillar 4)
        run: |
          python scripts/run_evaluation_benchmark.py --mode offline

      - name: Build frontend production bundle
        run: |
          npm run build --prefix frontend

      - name: Build Python distribution wheel
        run: |
          python scripts/build_distribution.py

  desktop-compile-gate:
    name: Windows Desktop Tauri Compilation Check
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend dependencies
        run: |
          npm ci --prefix frontend

      - name: Verify Tauri Windows Compilation
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml
