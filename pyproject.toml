[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "query-pilot"
version = "0.1.0"
description = "AI-powered autonomous data analyst with safe, self-correcting text-to-SQL workflows."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Yash Kakadiya" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi>=0.110.0",
    "google-genai>=0.1.0",
    "httpx>=0.27.0",
    "langgraph>=1.0.0",
    "langsmith>=0.1.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pyodbc>=5.1.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "sqlglot>=25.0.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
querypilot-agent = "query_pilot.agent.cli:main"
querypilot-api = "query_pilot.api.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"query_pilot.agent" = ["static/**/*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib -m 'not integration'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: Integration tests requiring the local SQL Server integration environment (GradeSense_Local)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
